default_alias = "review-cloud"

# num_ctx sets the Ollama context window. The Ollama backend uses the native
# /api/chat endpoint, which honors it (the OpenAI-compat /v1 endpoint did not),
# so this value both drives the advisor's VRAM-fit estimate and the actual load.
# Larger ctx = more VRAM; shrink it if a model offloads to CPU.

[models.review-cloud]
ollama_model = "qwen3-coder:480b-cloud"
base_url = "http://localhost:11434/v1"
num_ctx = 32768

# qwen3:8b (not qwen2.5-coder): the qwen2.5-coder family narrates findings as
# prose instead of calling submit_findings in the review-agent loop (dogfood),
# producing zero findings. qwen3 drives the agent reliably. ~5GB, low bar.
[models.review-local]
ollama_model = "qwen3:8b"
base_url = "http://localhost:11434/v1"
num_ctx = 16384

# Review effort tiers. These override the built-in defaults in
# review/harness.py (_DEFAULT_TIERS). Only the fields you set are overridden.
[effort.low]
max_findings = 8

[effort.med]
max_findings = 10

[effort.high]
max_findings = 12

[providers.ollama]
kind = "openai_compat"
base_url = "http://localhost:11434/v1"
api_key_env = ""

[providers.openai]
kind = "openai_compat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-4o"

[providers.gemini]
kind = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
default_model = "gemini-2.0-flash"

[providers.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
default_model = "claude-sonnet-4-6"
max_tokens = 4096
