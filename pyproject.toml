[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagura-code-reviewer"
version = "0.1.2"
description = "Cost-free Ollama-powered code-review agent for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "jfk" }]
keywords = [
  "code-review",
  "ollama",
  "llm",
  "claude-code",
  "static-analysis",
  "developer-tools",
  "ci",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = ["typer>=0.12", "rich>=13.7", "httpx>=0.27", "openai>=1.40", "anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/kagura-ai/kagura-code-reviewer"
Repository = "https://github.com/kagura-ai/kagura-code-reviewer"
Issues = "https://github.com/kagura-ai/kagura-code-reviewer/issues"
Changelog = "https://github.com/kagura-ai/kagura-code-reviewer/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpserver>=1.0", "pytest-cov>=6.0"]

[project.scripts]
kagura-code-reviewer = "kagura_code_reviewer.cli:app"
kagura-eval = "kagura_code_reviewer.eval_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kagura_code_reviewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Tests that drive a real Ollama backend are marked `ollama` and excluded from
# the default (network-free) run via addopts. Run them explicitly with
# `pytest -m ollama` (needs a local Ollama daemon); this is what the gated eval
# workflow does. A command-line `-m` overrides the addopts default.
markers = [
    "ollama: end-to-end test that drives a real Ollama backend (excluded by default).",
]
addopts = "-m 'not ollama'"
