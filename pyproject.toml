[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagura-code-reviewer"
version = "0.1.0"
description = "Cost-free Ollama-powered code-review agent for Claude Code"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7", "httpx>=0.27", "openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpserver>=1.0"]

[project.scripts]
kagura-code-reviewer = "kagura_code_reviewer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kagura_code_reviewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
