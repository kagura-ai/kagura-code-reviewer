# Golden set for the eval harness (issue #5).
#
# Seeded cases carry an INTENTIONAL bug introduced by the diff, fully labeled —
# they score both precision and recall. Historical cases are recall-only (a real
# diff may carry unknown latent bugs, so false positives are uncountable).
#
# `symptom` uses harness._SYMPTOM_PATTERNS canonical names so eval scoring matches
# the same way the reviewer dedups: zerodivision | index | key | none | attribute
# | type | value. Keep this set SMALL — running the full harness over each case on
# local Ollama is slow.
#
# Baseline numbers are captured separately (deferred follow-up); this file only
# defines what "a known bug" means per case.

[[case]]
name = "zerodiv_mean"
source = "seeded"
diff = '''
--- a/stats.py
+++ b/stats.py
@@ -1,3 +1,3 @@
 def mean(values):
-    return sum(values) / len(values) if values else 0.0
+    return sum(values) / len(values)
'''
  [[case.bug]]
  file = "stats.py"
  line = 2
  symptom = "zerodivision"
  dimension = "correctness"
  severity = "high"

